<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Snake 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: #f9f9f9;
        }
    </style>
</head>

<body>

    <h1>Snake 게임</h1>
    <p>점수: <span id="score">0</span></p>
    <p>조작: 방향키 ↑ ↓ ← →</p>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreText = document.getElementById("score");
        let score = 0;

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];

        let food = { x: 5, y: 5 };
        let badFood = { x: 15, y: 15 };

        let badFoodVisible = true;

        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;

        let gameOver = false;

        // 파란색 장애물: 3초 후 사라지고 2초 후 다시 나타남
        function startBadFoodTimer() {
            setTimeout(() => {
                if (gameOver) return;

                badFoodVisible = false;

                setTimeout(() => {
                    if (gameOver) return;

                    moveBadFood();
                    badFoodVisible = true;

                    startBadFoodTimer();
                }, 2000);

            }, 3000);
        }

        startBadFoodTimer();

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            if (event.key === "ArrowUp" && dy !== 1) {
                nextDx = 0;
                nextDy = -1;
            }

            if (event.key === "ArrowDown" && dy !== -1) {
                nextDx = 0;
                nextDy = 1;
            }

            if (event.key === "ArrowLeft" && dx !== 1) {
                nextDx = -1;
                nextDy = 0;
            }

            if (event.key === "ArrowRight" && dx !== -1) {
                nextDx = 1;
                nextDy = 0;
            }
        }

        function moveSnake() {
            dx = nextDx;
            dy = nextDy;

            const head = {
                x: snake[0].x + dx,
                y: snake[0].y + dy
            };

            snake.unshift(head);

            // 파란색 장애물이 보일 때 닿으면 게임 오버
            if (
                badFoodVisible &&
                head.x === badFood.x &&
                head.y === badFood.y
            ) {
                endGame();
                return;
            }

            // 빨간 사과를 먹으면 1점 증가
            if (head.x === food.x && head.y === food.y) {
                score += 1;
                scoreText.textContent = score;
                moveFood();
            } else {
                snake.pop();
            }

            checkCollision();
        }

        function moveFood() {
            do {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
            } while (
                snake.some(part =>
                    part.x === food.x && part.y === food.y
                ) ||
                (food.x === badFood.x && food.y === badFood.y)
            );
        }

        function moveBadFood() {
            do {
                badFood.x = Math.floor(Math.random() * tileCount);
                badFood.y = Math.floor(Math.random() * tileCount);
            } while (
                snake.some(part =>
                    part.x === badFood.x && part.y === badFood.y
                ) ||
                (badFood.x === food.x && badFood.y === food.y)
            );
        }

        function checkCollision() {
            const head = snake[0];

            if (
                head.x < 0 ||
                head.x >= tileCount ||
                head.y < 0 ||
                head.y >= tileCount
            ) {
                endGame();
                return;
            }

            for (let i = 1; i < snake.length; i++) {
                if (
                    head.x === snake[i].x &&
                    head.y === snake[i].y
                ) {
                    endGame();
                    return;
                }
            }
        }

        function endGame() {
            gameOver = true;

            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.font = "32px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";

            ctx.fillText(
                "게임 오버!",
                canvas.width / 2,
                canvas.height / 2 - 20
            );

            ctx.fillText(
                "점수 : " + score,
                canvas.width / 2,
                canvas.height / 2 + 30
            );
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                if (index === 0) {
                    ctx.fillStyle = "green";
                } else {
                    ctx.fillStyle = "lightgreen";
                }

                ctx.fillRect(
                    part.x * gridSize,
                    part.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );
            });
        }

        function drawFood() {
            // 빨간 사과
            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize - 2,
                gridSize - 2
            );

            // 파란색 장애물은 보일 때만 그림
            if (badFoodVisible) {
                ctx.fillStyle = "blue";
                ctx.fillRect(
                    badFood.x * gridSize,
                    badFood.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );
            }
        }

        function gameLoop() {
            if (gameOver) return;

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            moveSnake();

            if (gameOver) return;

            drawSnake();
            drawFood();
        }

        setInterval(gameLoop, 300);
    </script>

</body>

</html>
