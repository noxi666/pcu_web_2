<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Snake 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        canvas {
            border: 2px solid black;
            background: #f9f9f9;
        }
    </style>
</head>

<body>

    <h1>Snake 게임</h1>
    <p>점수: <span id="score">0</span></p>
    <p>조작: 방향키 ↑ ↓ ← →</p>
    <p>빨강: +1점 | 핑크: 가속 | 검정: 감속</p>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreText = document.getElementById("score");

        let score = 0;

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];

        let food = { x: 5, y: 5 };
        let badFood = { x: 15, y: 15 };
        let pinkFood = { x: 3, y: 15 };
        let blackFood = { x: 17, y: 3 };

        let badFoodVisible = true;

        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;

        let gameOver = false;

        // 게임 속도 (숫자가 작을수록 빠름)
        let gameSpeed = 300;
        let gameInterval;

        // 빨간 사과 타이머
        let foodTimer = null;

        // 게임 시작
        startGameLoop();
        startBadFoodTimer();

        function startGameLoop() {
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function changeDirection(event) {
            if (event.key === "ArrowUp" && dy !== 1) {
                nextDx = 0;
                nextDy = -1;
            }

            if (event.key === "ArrowDown" && dy !== -1) {
                nextDx = 0;
                nextDy = 1;
            }

            if (event.key === "ArrowLeft" && dx !== 1) {
                nextDx = -1;
                nextDy = 0;
            }

            if (event.key === "ArrowRight" && dx !== -1) {
                nextDx = 1;
                nextDy = 0;
            }
        }

        document.addEventListener("keydown", changeDirection);

        // 뱀 이동
        function moveSnake() {
            dx = nextDx;
            dy = nextDy;

            const head = {
                x: snake[0].x + dx,
                y: snake[0].y + dy
            };

            // 파란 장애물에 닿으면 게임 오버
            if (
                badFoodVisible &&
                head.x === badFood.x &&
                head.y === badFood.y
            ) {
                endGame();
                return;
            }

            snake.unshift(head);

            // 빨간 사과: 1점 획득
            if (head.x === food.x && head.y === food.y) {
                score += 1;
                scoreText.textContent = score;

                moveFood();
                updateFoodTimer();
            }

            // 핑크 사과: 가속
            else if (
                head.x === pinkFood.x &&
                head.y === pinkFood.y
            ) {
                gameSpeed = Math.max(80, gameSpeed - 50);
                moveSpecialFood(pinkFood);
                startGameLoop();
            }

            // 검은 사과: 감속
            else if (
                head.x === blackFood.x &&
                head.y === blackFood.y
            ) {
                gameSpeed = Math.min(800, gameSpeed + 50);
                moveSpecialFood(blackFood);
                startGameLoop();
            }

            else {
                snake.pop();
            }

            checkCollision();
        }

        // 사과가 뱀이나 다른 사과와 겹치지 않도록 위치 지정
        function randomPosition(excludedFoods = []) {
            let position;

            do {
                position = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (
                snake.some(part =>
                    part.x === position.x &&
                    part.y === position.y
                ) ||
                excludedFoods.some(item =>
                    item.x === position.x &&
                    item.y === position.y
                )
            );

            return position;
        }

        // 빨간 사과 이동
        function moveFood() {
            food = randomPosition([
                badFood, pinkFood, blackFood
            ]);
        }

        // 핑크 및 검은 사과 이동
        function moveSpecialFood(item) {
            item.x = -1;
            item.y = -1;

            const position = randomPosition([
                food, badFood, pinkFood, blackFood
            ]);

            item.x = position.x;
            item.y = position.y;
        }

        // 파란 장애물: 3초 표시, 2초 숨김
        function startBadFoodTimer() {
            setTimeout(() => {
                if (gameOver) return;

                badFoodVisible = false;

                setTimeout(() => {
                    if (gameOver) return;

                    badFood = randomPosition([
                        food, pinkFood, blackFood
                    ]);

                    badFoodVisible = true;
                    startBadFoodTimer();
                }, 2000);

            }, 3000);
        }

        // 점수가 10점을 초과하면 빨간 사과에 10초 제한
        function updateFoodTimer() {
            if (foodTimer !== null) {
                clearTimeout(foodTimer);
                foodTimer = null;
            }

            if (score > 10) {
                foodTimer = setTimeout(() => {
                    if (gameOver) return;

                    moveFood();
                    updateFoodTimer();
                }, 10000);
            }
        }

        // 충돌 검사
        function checkCollision() {
            const head = snake[0];

            if (
                head.x < 0 ||
                head.x >= tileCount ||
                head.y < 0 ||
                head.y >= tileCount
            ) {
                endGame();
                return;
            }

            for (let i = 1; i < snake.length; i++) {
                if (
                    head.x === snake[i].x &&
                    head.y === snake[i].y
                ) {
                    endGame();
                    return;
                }
            }
        }

        // 게임 오버
        function endGame() {
            gameOver = true;

            clearInterval(gameInterval);
            clearTimeout(foodTimer);

            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(
                0, 0, canvas.width, canvas.height
            );

            ctx.font = "32px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";

            ctx.fillText(
                "게임 오버!",
                canvas.width / 2,
                canvas.height / 2 - 20
            );

            ctx.font = "24px Arial";

            ctx.fillText(
                "점수: " + score,
                canvas.width / 2,
                canvas.height / 2 + 25
            );
        }

        // 뱀 그리기
        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle =
                    index === 0 ? "green" : "lightgreen";

                ctx.fillRect(
                    part.x * gridSize,
                    part.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );
            });
        }

        // 사과 및 장애물 그리기
        function drawFood() {
            // 빨간 사과
            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize - 2,
                gridSize - 2
            );

            // 파란 장애물
            if (badFoodVisible) {
                ctx.fillStyle = "blue";
                ctx.fillRect(
                    badFood.x * gridSize,
                    badFood.y * gridSize,
                    gridSize - 2,
                    gridSize - 2
                );
            }

            // 핑크 사과
            ctx.fillStyle = "hotpink";
            ctx.fillRect(
                pinkFood.x * gridSize,
                pinkFood.y * gridSize,
                gridSize - 2,
                gridSize - 2
            );

            // 검은 사과
            ctx.fillStyle = "black";
            ctx.fillRect(
                blackFood.x * gridSize,
                blackFood.y * gridSize,
                gridSize - 2,
                gridSize - 2
            );
        }

        // 게임 루프
        function gameLoop() {
            if (gameOver) return;

            ctx.clearRect(
                0, 0, canvas.width, canvas.height
            );

            moveSnake();

            if (gameOver) return;

            drawSnake();
            drawFood();
        }

    </script>

</body>

</html>
